const $=id=>document.getElementById(id); const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const localISO=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
const today=localISO(new Date()); const future=new Date(); future.setDate(future.getDate()+21); const cutoff=localISO(future);
const key=i=>[i.cohort,i.date||i.dateLabel,i.subject,i.period,i.topic].join("|");
const bounds=p=>{const n=(p.match(/\d+/g)||[]).map(Number);return n.length?{start:Math.min(...n),end:Math.max(...n)}:null};
function sessions(items){const out=[];for(const item of items){const b=bounds(item.period),p=out.at(-1),f=p?.items[0],same=f&&f.subject===item.subject&&f.type===item.type&&f.teacher===item.teacher&&f.location===item.location;if(p&&b&&p.end!==null&&same&&b.start===p.end+1){p.items.push(item);p.end=b.end}else out.push({items:[item],start:b?.start??null,end:b?.end??null})}return out}
function lessonDone(s){return s.items.every(i=>state.done.has(key(i)))} function save(){localStorage.setItem("cheer-share-done",JSON.stringify([...state.done]))}
function selectData(){return DATA.filter(i=>i.cohort===state.cohort&&(state.subject==="全部学科"||i.subject===state.subject)&&(state.type==="全部形式"||i.type===state.type)&&(state.scope==="all"||(state.scope==="today"?i.date===today:i.date&&i.date>=today&&i.date<=cutoff)))}
function renderToday(){const items=DATA.filter(i=>i.cohort===state.cohort&&i.date===today),ss=sessions(items),done=ss.filter(lessonDone).length,pct=ss.length?done/ss.length*100:0;$("todayTitle").textContent=ss.length?"今天有 "+ss.length+" 组课程":"今天没有课程安排";$("todayText").textContent=ss.length?items.map(i=>i.subject).filter((v,i,a)=>a.indexOf(v)===i).join(" · "):"可以按自己的节奏复习或休息。";$("todayCount").textContent=done+" / "+ss.length+" 已完成";$("todayBar").style.width=pct+"%";$("finishToday").disabled=!ss.length||done===ss.length;$("finishToday").textContent=done===ss.length&&ss.length?"今天已完成":"今天全部学完"}
function toggleSession(s){const all=lessonDone(s);s.items.forEach(i=>all?state.done.delete(key(i)):state.done.add(key(i)));save();render()}
function render(){document.querySelectorAll("#classSwitch button").forEach(b=>b.classList.toggle("active",b.dataset.value===state.cohort));document.querySelectorAll("#scopeTabs button").forEach(b=>b.classList.toggle("active",b.dataset.value===state.scope));renderToday();const list=selectData(),groups=new Map;list.forEach(i=>{const k=i.date||"第"+i.week+"周 · 集中见习";groups.set(k,[...(groups.get(k)||[]),i])});$("resultTitle").textContent=state.scope==="today"?"今天":state.scope==="upcoming"?"接下来要上的课":"全部课程安排";$("resultCount").textContent=list.length+" 条课程记录";if(!groups.size){$("timeline").innerHTML='<div class="empty"><strong>当前筛选下没有课程</strong><br><small>可以切换时间范围、学科或课程形式。</small></div>';return}$("timeline").innerHTML=[...groups].map(([k,items])=>{const first=items[0],date=first.date?new Intl.DateTimeFormat("zh-CN",{month:"numeric",day:"numeric",weekday:"short"}).format(new Date(first.date+"T12:00:00")):k,ss=sessions(items);return '<section class="day"><div class="date"><strong>'+esc(date)+'</strong><span>'+esc(first.date?"第 "+first.week+" 周":first.dateLabel)+'</span><button data-day="'+esc(k)+'">本日全部完成</button></div><div>'+ss.map((s,ix)=>{const i=s.items[0],pd=s.start===null?(i.period||"待定"):(s.start===s.end?String(s.start):s.start+"—"+s.end),hours=s.items.reduce((a,x)=>a+(Number(x.hours)||0),0),checked=lessonDone(s);return '<article class="lesson"><div class="period"><strong>'+esc(pd)+'</strong><span>节'+(s.items.length>1?' · 连续':'')+'</span></div><div><div class="meta"><span class="kind '+(i.type!=="理论"?'practice':'')+'">'+esc(i.type)+'</span>'+esc(i.subject)+'</div><div class="topics">'+s.items.map(x=>'<h2><small>'+esc(x.period)+'节</small>'+esc(x.topic)+'</h2>').join('')+'</div><p class="details">'+esc([i.teacher,hours?hours+' 学时':'',i.location].filter(Boolean).join(' · '))+'</p></div><button class="done '+(checked?'checked':'')+'" data-session="'+esc(k)+'|'+ix+'"><i></i>'+(checked?'已完成':'标记完成')+'</button></article>'}).join('')+'</div></section>'}).join('');document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{const [g,n]=b.dataset.session.split('|');toggleSession(sessions(groups.get(g))[Number(n)])});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{sessions(groups.get(b.dataset.day)).forEach(s=>s.items.forEach(i=>state.done.add(key(i))));save();render()})}
SUBJECTS.forEach(s=>$("subject").add(new Option(s,s)));$("subject").onchange=e=>{state.subject=e.target.value;render()};$("type").onchange=e=>{state.type=e.target.value;render()};document.querySelectorAll("#classSwitch button").forEach(b=>b.onclick=()=>{state.cohort=b.dataset.value;localStorage.setItem("cheer-share-cohort",state.cohort);render()});document.querySelectorAll("#scopeTabs button").forEach(b=>b.onclick=()=>{state.scope=b.dataset.value;render()});$("finishToday").onclick=()=>{sessions(DATA.filter(i=>i.cohort===state.cohort&&i.date===today)).forEach(s=>s.items.forEach(i=>state.done.add(key(i))));save();$("todayCard").classList.add("confetti");setTimeout(()=>$("todayCard").classList.remove("confetti"),550);render()};$("reset").onclick=()=>{if(confirm("确定清除这台设备上的所有完成记录吗？")){state.done.clear();save();render()}};render();</script>
</body></html>
