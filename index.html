<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>本学期进度 | GEORGIA NOTES-ONLINE</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/progress.css" />
    <script src="assets/progress.js" defer></script>
  </head>
  <body class="progress-page">
    <header class="site-header">
      <div class="header-inner">
        <div>
          <h1 class="site-title">GEORGIA NOTES-ONLINE</h1>
          <p class="site-kicker">本学期进度</p>
          <p class="site-subtitle">2026—2027 学年第一学期 · 每完成一节，离目标更近一点。</p>
        </div>
        <aside class="library-stats" aria-label="本学期学习进度">
          <strong id="semesterCount">正在读取进度</strong>
          <span id="semesterClass">完成记录保存在当前浏览器</span>
        </aside>
      </div>
    </header>

    <main class="main-content">
      <nav class="site-switcher" aria-label="站点功能">
        <a class="switcher-link is-active" href="index.html" aria-current="page">本学期进度</a>
        <a class="switcher-link" href="courses.html">课程资料</a>
        <a class="switcher-link" href="pages/banks.html">佛脚刷题</a>
        <a class="switcher-link" href="pages/syllabi.html">课程大纲</a>
      </nav>

      <section id="status" class="status" role="status">正在加载本学期课程安排。</section>
      <noscript><p class="status">请开启浏览器的 JavaScript，以查看课程安排和保存学习进度。</p></noscript>

      <div id="progressContent" hidden>
        <section class="progress-overview" aria-labelledby="todayTitle">
          <div class="progress-today-copy">
            <p class="progress-eyebrow" id="todayDate"></p>
            <h2 id="todayTitle">今天的学习安排</h2>
            <p class="progress-today-subjects" id="todayText"></p>
          </div>
          <div class="progress-today-action">
            <p class="progress-today-count" id="todayCount"></p>
            <div id="todayTrack" class="progress-track" role="progressbar" aria-label="今日完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="todayBar"></i></div>
            <button class="progress-button is-primary" id="finishToday" type="button">今天全部学完</button>
          </div>
        </section>

        <section class="progress-filters" aria-label="课程筛选">
          <div class="progress-filter-row">
            <span class="progress-label" id="classLabel">我的班级</span>
            <div class="progress-segments" id="classSwitch" role="group" aria-labelledby="classLabel">
              <button type="button" data-value="9、11班" aria-pressed="true">9、11班</button>
              <button type="button" data-value="21、22班" aria-pressed="false">21、22班</button>
            </div>
            <span class="progress-filter-hint">集中见习可在“完整学期”中查看</span>
          </div>
          <div class="progress-filter-row progress-filter-options">
            <div class="progress-segments progress-scope" id="scopeTabs" role="group" aria-label="时间范围">
              <button type="button" data-value="today" aria-pressed="false">今天</button>
              <button type="button" data-value="upcoming" aria-pressed="true">未来三周</button>
              <button type="button" data-value="all" aria-pressed="false">完整学期</button>
            </div>
            <label class="progress-select"><span>学科</span><select id="subject" aria-label="筛选学科"></select></label>
            <label class="progress-select"><span>课程形式</span><select id="type" aria-label="筛选课程形式"><option>全部形式</option><option>理论</option><option>见习</option><option>实训</option></select></label>
          </div>
        </section>

        <div class="progress-list-heading">
          <h2 id="resultTitle">接下来要上的课</h2>
          <span id="resultCount"></span>
        </div>
        <div class="progress-timeline" id="timeline"></div>

        <div class="progress-storage">
          <p id="storageNote">进度自动保存在当前浏览器，每位访客独立记录。换设备、换浏览器或清除网站数据后不会自动同步。</p>
          <button id="reset" class="progress-text-button" type="button">清除我的完成记录</button>
        </div>
        <p id="saveStatus" class="progress-feedback" role="status" aria-live="polite"></p>
      </div>
    </main>

    <footer class="site-footer">
      <p>免责声明：资料仅用于课程学习与考试复习，不作为临床诊疗依据；待核实内容需以教材、指南或授课材料为准。</p>
    </footer>
  </body>
</html>
